<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUPII — مساعد الوثائق الفنية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFFFFF;
    --panel: #F5F5F5;
    --panel-2: #EDEDED;
    --line: #D9D9D9;
    --text: #0A0A0A;
    --muted: #6B6B6B;
    --accent: #000000;
    --accent-dim: #B0B0B0;
    --steel: #000000;
    --danger: #C1573F;
  }
  *{ box-sizing: border-box; }
  /* الإصلاح: كان html,body{height:100%} وده كان بيخلي الـsticky header يخرج مع السكرول */
  html{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px;
    background-attachment: fixed;
    background-position: -1px -1px;
    color: var(--text);
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  header{
    border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(6px);
    padding: 18px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position: sticky;
    top:0;
    z-index: 10;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand-mark{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: #FFFFFF;
    background: var(--accent);
    border: 1px solid var(--accent);
    padding: 3px 8px;
    border-radius: 3px;
  }
  .brand h1{
    font-size: 17px;
    font-weight:600;
    margin:0;
    color: var(--text);
  }
  .brand span.sub{
    color: var(--muted);
    font-size: 13px;
    margin-right: 4px;
  }

  .upload-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 9px 16px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13.5px;
    cursor:pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .upload-btn:hover{ border-color: var(--steel); color:#000; background: var(--panel-2); }
  .upload-btn svg{ width:15px; height:15px; flex-shrink:0; }
  #file-input, #image-input{ display:none; }

  .header-actions{
    display:flex;
    align-items:center;
    gap: 8px;
  }

  .attach-btn{
    background: transparent;
    border: none;
    color: var(--muted);
    width: 38px;
    height: 38px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-radius: 5px;
    transition: color .15s ease, background .15s ease;
  }
  .attach-btn:hover{ color: var(--text); background: var(--panel-2); }
  .attach-btn svg{ width:19px; height:19px; }

  .mic-btn.recording{
    color: #fff;
    background: var(--danger);
    animation: mic-pulse 1.4s ease-in-out infinite;
  }
  .mic-btn.recording:hover{
    color: #fff;
    background: var(--danger);
  }
  @keyframes mic-pulse{
    0%   { box-shadow: 0 0 0 0 rgba(193,87,63,0.45); }
    70%  { box-shadow: 0 0 0 9px rgba(193,87,63,0); }
    100% { box-shadow: 0 0 0 0 rgba(193,87,63,0); }
  }
  .rec-timer{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--danger);
    align-self:center;
    padding: 0 4px;
    min-width: 34px;
    text-align:center;
  }

  .image-msg{
    max-width: 220px;
    border-radius: 6px;
    border: 1px solid var(--line);
    display:block;
    margin-bottom: 8px;
  }

  .composer-wrap{
    max-width: 760px;
    margin: 0 auto;
  }
  .attach-preview{
    display:flex;
    align-items:flex-start;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    padding: 10px;
  }
  .attach-preview-thumb{
    position:relative;
    width: 64px;
    height: 64px;
    flex-shrink:0;
  }
  .attach-preview-thumb img{
    width:100%;
    height:100%;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--line);
    display:block;
  }
  .attach-preview-remove{
    position:absolute;
    top:-6px;
    left:-6px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 12px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .attach-preview-name{
    font-size: 12.5px;
    color: var(--muted);
    align-self:center;
  }

  .live-trigger{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13.5px;
    cursor:pointer;
    transition: filter .15s ease;
  }
  .live-trigger:hover{ filter: brightness(1.2); }
  .live-trigger svg{ width:15px; height:15px; flex-shrink:0; }

  .live-overlay{
    position: fixed;
    inset: 0;
    background: #0A0A0A;
    z-index: 100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding: 32px 24px 40px;
  }
  .live-overlay.hidden{ display:none; }

  .live-top{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .live-brand{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing:0.08em;
    color: rgba(255,255,255,0.5);
  }
  .live-close{
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size: 18px;
    line-height:1;
  }

  .live-orb-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .live-orb{
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #4a4a4a, #0d0d0d 72%);
    border: 1px solid rgba(255,255,255,0.15);
    transition: transform .25s ease;
  }
  .live-orb.listening{ animation: orb-listen 1.6s ease-in-out infinite; }
  .live-orb.thinking{ animation: orb-think 1s linear infinite; }
  .live-orb.speaking{ animation: orb-speak 0.85s ease-in-out infinite; }
  @keyframes orb-listen{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.08); }
  }
  @keyframes orb-think{
    0%{ filter:brightness(0.75); }
    50%{ filter:brightness(1.35); }
    100%{ filter:brightness(0.75); }
  }
  @keyframes orb-speak{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.14); }
  }

  .live-caption-wrap{
    max-width: 620px;
    text-align:center;
  }
  .live-status{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing:0.08em;
    color: rgba(255,255,255,0.45);
    margin-bottom: 10px;
  }
  .live-caption{
    min-height: 50px;
    font-size: 16px;
    line-height:1.85;
    color: rgba(255,255,255,0.92);
    padding: 0 12px;
  }

  .live-end-btn{
    background: var(--danger);
    color: #fff;
    border: none;
    padding: 12px 30px;
    border-radius: 30px;
    font-family: inherit;
    font-size: 14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .live-end-btn:hover{ filter: brightness(1.1); }

  main{
    flex:1;
    width:100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 140px;
    display:flex;
    flex-direction:column;
    gap: 18px;
  }

  .empty-state{
    margin-top: 10vh;
    text-align:center;
    color: var(--muted);
  }
  .empty-state .tick{
    font-family:'IBM Plex Mono', monospace;
    color: var(--accent);
    font-size: 12px;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }
  .empty-state h2{
    color: var(--text);
    font-weight: 600;
    font-size: 20px;
    margin: 0 0 8px;
  }
  .empty-state p{ font-size: 14px; line-height:1.7; max-width: 420px; margin: 0 auto; }

  .msg{
    display:flex;
    flex-direction:column;
    max-width: 82%;
  }
  .msg.user{ align-self:flex-end; align-items:flex-end; }
  .msg.assistant{ align-self:flex-start; align-items:flex-start; }

  .bubble{
    padding: 13px 16px;
    border-radius: 6px;
    font-size: 14.5px;
    line-height: 1.85;
    white-space: pre-wrap;
  }
  .msg.user .bubble{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-left: 2px solid var(--accent);
  }
  .msg.assistant .bubble{
    background: var(--panel);
    border: 1px solid var(--line);
    border-right: 2px solid var(--steel);
  }
  .msg.assistant .bubble.pending{ color: var(--muted); }

  .upload-toast{
    align-self:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    background: var(--panel);
    border: 1px dashed var(--line);
    padding: 6px 14px;
    border-radius: 4px;
  }
  .upload-toast.ok{ color: var(--text); border-color: var(--accent); font-weight:600; }
  .upload-toast.err{ color: var(--danger); border-color: var(--danger); }

  footer{
    position: fixed;
    bottom:0; left:0; right:0;
    padding: 18px 20px 22px;
    background: linear-gradient(to top, var(--bg) 55%, transparent);
  }
  .composer{
    max-width: 760px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    display:flex;
    align-items:flex-end;
    gap: 8px;
    padding: 8px 8px 8px 8px;
  }
  .composer textarea{
    flex:1;
    resize:none;
    background: transparent;
    border:none;
    outline:none;
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;
    line-height:1.6;
    max-height: 140px;
    min-height: 26px;
    padding: 9px 8px;
  }
  .composer.has-attachment{
    border-radius: 0 0 8px 8px;
  }
  .send-btn{
    background: var(--accent);
    color: #FFFFFF;
    border:none;
    border-radius: 5px;
    width: 38px;
    height: 38px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: filter .15s ease, opacity .15s ease;
  }
  .send-btn:hover{ filter: brightness(1.3); }
  .send-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .send-btn svg{ width:16px; height:16px; transform: rotate(180deg); }

  ::-webkit-scrollbar{ width: 8px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 4px; }

  /* =========================
     Chats Sidebar (Drawer)
  ========================= */
  .sidebar-backdrop{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
    z-index: 60;
  }
  .sidebar-backdrop.visible{ opacity: 1; pointer-events: auto; }

  .sidebar{
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 272px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    transform: translateX(-100%);
    transition: transform .2s ease;
    z-index: 70;
    display: flex;
    flex-direction: column;
    direction: rtl;
  }
  .sidebar.open{ transform: translateX(0); }

  .sidebar-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--line);
    flex-shrink:0;
  }
  .sidebar-title{ font-weight:600; font-size:14px; }
  .sidebar-close{
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 18px;
    line-height:1;
    cursor:pointer;
    width: 28px;
    height: 28px;
    border-radius: 5px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .sidebar-close:hover{ background: var(--panel-2); color: var(--text); }

  .new-chat-btn{
    margin: 12px 16px;
    display:flex;
    align-items:center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 10px 14px;
    font-family: inherit;
    font-size: 13.5px;
    cursor:pointer;
    flex-shrink:0;
    transition: filter .15s ease;
  }
  .new-chat-btn:hover{ filter: brightness(1.25); }
  .new-chat-btn svg{ width:15px; height:15px; flex-shrink:0; }

  .chat-list{
    flex: 1;
    overflow-y: auto;
    padding: 4px 10px 16px;
    display:flex;
    flex-direction:column;
    gap: 3px;
  }

  .chat-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 6px;
    padding: 9px 10px;
    border-radius: 5px;
    cursor:pointer;
    font-size: 13px;
    color: var(--muted);
    border: 1px solid transparent;
    transition: background .12s ease, color .12s ease;
  }
  .chat-item:hover{ background: var(--panel-2); color: var(--text); }
  .chat-item.active{
    background: var(--panel-2);
    color: var(--text);
    border-color: var(--line);
    border-right: 2px solid var(--steel);
  }
  .chat-item-title{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1;
  }
  .chat-item-del{
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 15px;
    line-height:1;
    cursor:pointer;
    flex-shrink:0;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    opacity: 0;
    transition: opacity .12s ease, background .12s ease, color .12s ease;
  }
  .chat-item:hover .chat-item-del{ opacity: 1; }
  .chat-item-del:hover{ background: var(--danger); color: #fff; }

  .header-left{
    display:flex;
    align-items:center;
    gap: 14px;
  }
  .sidebar-toggle{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    width: 38px;
    height: 38px;
    flex-shrink:0;
    border-radius: 5px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .sidebar-toggle:hover{ background: var(--panel-2); border-color: var(--steel); }
  .sidebar-toggle svg{ width:17px; height:17px; }
</style>
</head>
<body>

<div class="sidebar-backdrop" id="sidebar-backdrop"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <span class="sidebar-title">المحادثات</span>
    <button class="sidebar-close" id="sidebar-close" type="button" aria-label="إغلاق">×</button>
  </div>
  <button class="new-chat-btn" id="new-chat-btn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    محادثة جديدة
  </button>
  <div class="chat-list" id="chat-list"></div>
</aside>

<header>
  <div class="header-left">
    <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="القوائم">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand">
      <span class="brand-mark">CUPII</span>
      <h1>CUPII<span class="sub">مساعد الوثائق الفنية</span></h1>
    </div>
  </div>
  <div class="header-actions">
    <button class="live-trigger" id="live-trigger" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 19v3"/></svg>
      محادثة صوتية مباشرة
    </button>
    <button class="upload-btn" id="upload-trigger" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      رفع مستند (PDF / TXT)
    </button>
  </div>
  <input type="file" id="file-input" accept=".pdf,.txt">
</header>

<main id="thread">
  <div class="empty-state" id="empty-state">
    <div class="tick">// قاعدة معرفة فارغة</div>
    <h2>ابدأ برفع كتالوج أو مستند فني</h2>
    <p>ارفع ملف PDF أو TXT فيه مواصفات الماكينات أو الكتالوجات، وبعدين اسأل عنه بالعربي وهرد عليك من جوه المستندات بس.</p>
  </div>
</main>

<footer>
  <div class="composer-wrap">
    <div class="attach-preview" id="attach-preview" style="display:none;">
      <div class="attach-preview-thumb">
        <img id="attach-preview-img" src="" alt="">
        <button class="attach-preview-remove" id="attach-preview-remove" type="button" aria-label="إزالة">×</button>
      </div>
      <span class="attach-preview-name" id="attach-preview-name"></span>
    </div>
    <div class="composer" id="composer">
      <button class="attach-btn" id="image-trigger" type="button" aria-label="إرفاق صورة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.44 11.05l-9.19 9.19a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a1.5 1.5 0 0 1-2.12-2.12l8.49-8.48"/></svg>
      </button>
      <input type="file" id="image-input" accept="image/jpeg,image/png,image/webp">
      <textarea id="input" placeholder="اكتب سؤالك عن المستندات..." rows="1"></textarea>
      <span class="rec-timer" id="rec-timer" style="display:none;">00:00</span>
      <button class="attach-btn mic-btn" id="mic-btn" type="button" aria-label="تسجيل صوتي">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 19v3"/></svg>
      </button>
      <button class="send-btn" id="send-btn" type="button" aria-label="إرسال">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>
</footer>

<div class="live-overlay hidden" id="live-overlay" dir="rtl">
  <div class="live-top">
    <span class="live-brand">CUPII // مكالمة مباشرة</span>
    <button class="live-close" id="live-close" type="button" aria-label="إغلاق">×</button>
  </div>
  <div class="live-orb-wrap">
    <div class="live-orb" id="live-orb"></div>
  </div>
  <div class="live-caption-wrap">
    <div class="live-status" id="live-status">بيستأذن الميكروفون...</div>
    <div class="live-caption" id="live-caption"></div>
  </div>
  <button class="live-end-btn" id="live-end-btn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M6 6l12 12M18 6L6 18"/></svg>
    إنهاء المكالمة
  </button>
</div>

<script>
  const thread = document.getElementById('thread');
  const emptyState = document.getElementById('empty-state');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const fileInput = document.getElementById('file-input');
  const uploadTrigger = document.getElementById('upload-trigger');
  const imageInput = document.getElementById('image-input');
  const imageTrigger = document.getElementById('image-trigger');
  const composer = document.getElementById('composer');
  const attachPreview = document.getElementById('attach-preview');
  const attachPreviewImg = document.getElementById('attach-preview-img');
  const attachPreviewName = document.getElementById('attach-preview-name');
  const attachPreviewRemove = document.getElementById('attach-preview-remove');
  const micBtn = document.getElementById('mic-btn');
  const recTimer = document.getElementById('rec-timer');

  let pendingImage = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let recordingTimerHandle = null;
  let recordingSeconds = 0;

  function hideEmptyState(){
    if (emptyState) emptyState.style.display = 'none';
  }

  function scrollToBottom(){
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  function addMessage(role, text){
    hideEmptyState();
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    thread.appendChild(wrap);
    scrollToBottom();
    return { wrap, bubble };
  }

  function addImageMessage(file){
    hideEmptyState();
    const wrap = document.createElement('div');
    wrap.className = 'msg user';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const img = document.createElement('img');
    img.className = 'image-msg';
    img.src = URL.createObjectURL(file);
    bubble.appendChild(img);
    wrap.appendChild(bubble);
    thread.appendChild(wrap);
    scrollToBottom();
  }

  function setPendingImage(file){
    pendingImage = file;
    attachPreviewImg.src = URL.createObjectURL(file);
    attachPreviewName.textContent = file.name;
    attachPreview.style.display = 'flex';
    composer.classList.add('has-attachment');
  }

  function clearPendingImage(){
    pendingImage = null;
    attachPreviewImg.src = '';
    attachPreview.style.display = 'none';
    composer.classList.remove('has-attachment');
    imageInput.value = '';
  }

  function addToast(text, kind){
    hideEmptyState();
    const toast = document.createElement('div');
    toast.className = 'upload-toast ' + (kind || '');
    toast.textContent = text;
    thread.appendChild(toast);
    scrollToBottom();
  }

  async function sendMessage(){
    const q = input.value.trim();
    const attachedImage = pendingImage;

    if (!q && !attachedImage) return;

    input.value = '';
    input.style.height = 'auto';

    if (attachedImage){
      addImageMessage(attachedImage);
      clearPendingImage();
    }
    if (q){
      addMessage('user', q);
    }

    // Build conversation memory from this chat's earlier turns BEFORE
    // recording the current turn (so we don't duplicate it).
    const historyContext = buildHistoryContext();

    const userMemoryText = (attachedImage ? '📷 [صورة مرفقة] ' : '') + (q || '');
    recordMessage('user', userMemoryText.trim());

    const { bubble } = addMessage(
      'assistant',
      attachedImage ? 'بيحلل الصورة...' : 'بيدور في المستندات...'
    );
    bubble.classList.add('pending');
    sendBtn.disabled = true;

    try{
      let res, data;

      if (attachedImage){
        const formData = new FormData();
        formData.append('file', attachedImage);
        res = await fetch('/analyze-image', { method: 'POST', body: formData });
        data = await res.json();
      } else {
        const fullQuestion = historyContext
          ? (historyContext + 'السؤال الحالي:\n' + q)
          : q;
        res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: fullQuestion })
        });
        data = await res.json();
      }

      bubble.classList.remove('pending');
      if (!res.ok){
        bubble.textContent = 'حصل خطأ: ' + (data.detail || 'غير معروف');
      } else {
        bubble.textContent = data.answer;
        recordMessage('assistant', data.answer);
      }
    } catch(err){
      bubble.classList.remove('pending');
      bubble.textContent = 'مفيش اتصال بالسيرفر. اتأكد إن الباك اند شغال.';
    } finally {
      sendBtn.disabled = false;
      scrollToBottom();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  uploadTrigger.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    addToast('بيرفع ' + file.name + ' ...');

    const formData = new FormData();
    formData.append('file', file);

    try{
      const res = await fetch('/upload', { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok){
        addToast('فشل الرفع: ' + (data.detail || 'غير معروف'), 'err');
      } else {
        addToast(`تم رفع ${data.filename} — ${data.chunks} مقطع اتضاف لقاعدة المعرفة`, 'ok');
      }
    } catch(err){
      addToast('فشل الاتصال بالسيرفر أثناء الرفع', 'err');
    } finally {
      fileInput.value = '';
    }
  });

  imageTrigger.addEventListener('click', () => imageInput.click());
  imageInput.addEventListener('change', () => {
    const file = imageInput.files[0];
    if (!file) return;
    setPendingImage(file);
  });
  attachPreviewRemove.addEventListener('click', clearPendingImage);

  function formatTime(totalSeconds){
    const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
    const s = String(totalSeconds % 60).padStart(2, '0');
    return m + ':' + s;
  }

  function startRecordingUi(){
    micBtn.classList.add('recording');
    recTimer.style.display = 'inline-block';
    recordingSeconds = 0;
    recTimer.textContent = formatTime(0);
    recordingTimerHandle = setInterval(() => {
      recordingSeconds += 1;
      recTimer.textContent = formatTime(recordingSeconds);
    }, 1000);
  }

  function stopRecordingUi(){
    micBtn.classList.remove('recording');
    recTimer.style.display = 'none';
    clearInterval(recordingTimerHandle);
    recordingTimerHandle = null;
  }

  async function startRecording(){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.addEventListener('dataavailable', (e) => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      });

      mediaRecorder.addEventListener('stop', async () => {
        stream.getTracks().forEach(track => track.stop());
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        await sendForTranscription(blob);
      });

      mediaRecorder.start();
      startRecordingUi();
    } catch(err){
      addToast('مفيش صلاحية استخدام الميكروفون', 'err');
    }
  }

  function stopRecording(){
    if (mediaRecorder && mediaRecorder.state !== 'inactive'){
      mediaRecorder.stop();
    }
    stopRecordingUi();
  }

  async function sendForTranscription(blob){
    const toast = document.createElement('div');
    toast.className = 'upload-toast';
    toast.textContent = 'بيحول الصوت لنص...';
    hideEmptyState();
    thread.appendChild(toast);
    scrollToBottom();

    const formData = new FormData();
    formData.append('file', blob, 'recording.webm');

    try{
      const res = await fetch('/transcribe', { method: 'POST', body: formData });
      const data = await res.json();
      toast.remove();

      if (!res.ok){
        addToast('فشل تحويل الصوت: ' + (data.detail || 'غير معروف'), 'err');
        return;
      }

      const current = input.value.trim();
      input.value = current ? (current + ' ' + data.text) : data.text;
      input.dispatchEvent(new Event('input'));
      input.focus();
    } catch(err){
      toast.remove();
      addToast('فشل الاتصال بالسيرفر أثناء تحويل الصوت', 'err');
    }
  }

  micBtn.addEventListener('click', () => {
    if (mediaRecorder && mediaRecorder.state === 'recording'){
      stopRecording();
    } else {
      startRecording();
    }
  });

  // =========================
  // Live Voice Call Mode
  // =========================

  const liveTrigger = document.getElementById('live-trigger');
  const liveOverlay = document.getElementById('live-overlay');
  const liveClose = document.getElementById('live-close');
  const liveEndBtn = document.getElementById('live-end-btn');
  const liveOrb = document.getElementById('live-orb');
  const liveStatus = document.getElementById('live-status');
  const liveCaption = document.getElementById('live-caption');

  let liveActive = false;
  let liveStream = null;
  let liveAudioCtx = null;
  let livePlayingAudio = null;
  let liveStopPlayback = null;   // بيوقف الجزء اللي بيتشغل حاليًا ويحل الـpromise
  let liveSession = 0;           // رقم المكالمة (عشان نوقف أي تشغيل قديم)

  const SILENCE_LEVEL = 6;
  const SILENCE_HOLD_MS = 800;   // كان 1100: أسرع في اكتشاف إنك خلصت كلام
  const MAX_TURN_MS = 20000;

  function setOrbState(state){
    liveOrb.classList.remove('listening', 'thinking', 'speaking');
    if (state) liveOrb.classList.add(state);
  }

  // ---------------------------------------------------------
  // Streaming TTS:
  //  1) /speak-chunks بيقسّم الرد لأجزاء (أول جزء قصير)
  //  2) كل جزء بيتولّد لوحده عبر /speak-one
  //  3) أول ما جزء يجهز بيتشغّل، وفي نفس الوقت الجزء اللي بعده
  //     بيتولّد في الخلفية. فالصوت بيبدأ بعد أول جزء بس.
  // ---------------------------------------------------------

  async function fetchChunkAudio(text){
    const res = await fetch('/speak-one', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    if (!res.ok) throw new Error('tts request failed');
    const blob = await res.blob();
    return URL.createObjectURL(blob);
  }

  function playUrl(url){
    return new Promise((resolve) => {
      const audio = new Audio(url);
      livePlayingAudio = audio;

      const done = () => {
        URL.revokeObjectURL(url);
        if (livePlayingAudio === audio) livePlayingAudio = null;
        if (liveStopPlayback === done) liveStopPlayback = null;
        resolve();
      };

      liveStopPlayback = done;
      audio.addEventListener('ended', done);
      audio.addEventListener('error', done);
      audio.play().catch(done);
    });
  }

  async function speakStreaming(text){
    if (!text) return;

    const session = liveSession;

    let chunks = [];
    try{
      const res = await fetch('/speak-chunks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      if (!res.ok) throw new Error('chunking failed');
      const data = await res.json();
      chunks = data.chunks || [];
    } catch(err){
      // لو الـTTS مش شغال نكمل المكالمة من غير صوت بدل ما نعلّق.
      return;
    }

    if (!chunks.length) return;

    const pending = [];
    const startFetch = (i) => {
      pending[i] = fetchChunkAudio(chunks[i]).catch(() => null);
      return pending[i];
    };

    startFetch(0);

    for (let i = 0; i < chunks.length; i++){
      if (!liveActive || session !== liveSession) break;

      const url = await pending[i];

      // أول ما الجزء ده يجهز، نبدأ نولّد اللي بعده وإحنا بنشغّل ده
      if (i + 1 < chunks.length && !pending[i + 1]) startFetch(i + 1);

      if (!liveActive || session !== liveSession){
        if (url) URL.revokeObjectURL(url);
        break;
      }

      if (!url) continue;

      if (i === 0) liveStatus.textContent = 'بيتكلم...';

      await playUrl(url);
    }

    // تنظيف أي أجزاء اتولّدت وماتشغّلتش (لو المكالمة اتقفلت)
    for (let i = 0; i < pending.length; i++){
      if (!pending[i]) continue;
      pending[i].then((u) => { if (u) { try { URL.revokeObjectURL(u); } catch(e){} } });
    }
  }

  async function openLiveMode(){
    liveSession += 1;
    liveOverlay.classList.remove('hidden');
    liveActive = true;
    liveCaption.textContent = '';
    liveStatus.textContent = 'بيستأذن الميكروفون...';
    setOrbState(null);

    try{
      liveStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch(err){
      liveStatus.textContent = 'مفيش صلاحية استخدام الميكروفون';
      return;
    }

    runLiveTurn();
  }

  function closeLiveMode(){
    liveActive = false;
    liveSession += 1;
    if (livePlayingAudio){
      livePlayingAudio.pause();
      livePlayingAudio = null;
    }
    if (liveStopPlayback){
      liveStopPlayback();
      liveStopPlayback = null;
    }
    if (liveStream){
      liveStream.getTracks().forEach(t => t.stop());
      liveStream = null;
    }
    if (liveAudioCtx){
      liveAudioCtx.close();
      liveAudioCtx = null;
    }
    liveOverlay.classList.add('hidden');
  }

  function runLiveTurn(){
    if (!liveActive || !liveStream) return;

    liveStatus.textContent = 'بيسمعك...';
    liveCaption.textContent = '';
    setOrbState('listening');

    liveAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = liveAudioCtx.createMediaStreamSource(liveStream);
    const analyser = liveAudioCtx.createAnalyser();
    analyser.fftSize = 2048;
    source.connect(analyser);
    const dataArray = new Uint8Array(analyser.fftSize);

    const recorder = new MediaRecorder(liveStream);
    const chunks = [];
    recorder.addEventListener('dataavailable', (e) => {
      if (e.data && e.data.size > 0) chunks.push(e.data);
    });

    let hasSpoken = false;
    let silenceStart = null;
    const startTime = Date.now();
    let stopped = false;

    function stopTurn(){
      if (stopped) return;
      stopped = true;
      if (recorder.state !== 'inactive') recorder.stop();
      if (liveAudioCtx){
        liveAudioCtx.close();
        liveAudioCtx = null;
      }
    }

    function checkLevel(){
      if (!liveActive || stopped) return;

      analyser.getByteTimeDomainData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++){
        const v = dataArray[i] - 128;
        sum += v * v;
      }
      const rms = Math.sqrt(sum / dataArray.length);

      if (rms > SILENCE_LEVEL){
        hasSpoken = true;
        silenceStart = null;
      } else if (hasSpoken){
        if (!silenceStart) silenceStart = Date.now();
        if (Date.now() - silenceStart > SILENCE_HOLD_MS){
          stopTurn();
          return;
        }
      }

      if (Date.now() - startTime > MAX_TURN_MS){
        stopTurn();
        return;
      }

      requestAnimationFrame(checkLevel);
    }

    recorder.addEventListener('stop', async () => {
      if (!liveActive) return;

      if (!hasSpoken){
        runLiveTurn();
        return;
      }

      const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
      await handleLiveTurn(blob);
    });

    recorder.start();
    requestAnimationFrame(checkLevel);
  }

  async function handleLiveTurn(blob){
    if (!liveActive) return;

    liveStatus.textContent = 'بيفهم كلامك...';
    setOrbState('thinking');

    let question = '';
    try{
      const formData = new FormData();
      formData.append('file', blob, 'live.webm');
      const res = await fetch('/transcribe', { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok || !data.text || data.text.includes('لم يتم التعرف')){
        if (liveActive) runLiveTurn();
        return;
      }
      question = data.text;
    } catch(err){
      liveStatus.textContent = 'مفيش اتصال بالسيرفر';
      if (liveActive) setTimeout(runLiveTurn, 1500);
      return;
    }

    if (!liveActive) return;
    liveCaption.textContent = question;
    liveStatus.textContent = 'بيدور في المستندات...';

    const historyContext = buildHistoryContext();
    recordMessage('user', question);

    let answer = '';
    try{
      const fullQuestion = historyContext
        ? (historyContext + 'السؤال الحالي:\n' + question)
        : question;
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        // voice: true => رد قصير مناسب للكلام + context أصغر = أسرع
        body: JSON.stringify({ question: fullQuestion, voice: true })
      });
      const data = await res.json();
      answer = res.ok ? data.answer : ('حصل خطأ: ' + (data.detail || 'غير معروف'));
      if (res.ok) recordMessage('assistant', answer);
    } catch(err){
      answer = 'مفيش اتصال بالسيرفر.';
    }

    if (!liveActive) return;
    liveCaption.textContent = answer;
    liveStatus.textContent = 'بيجهز الصوت...';
    setOrbState('speaking');

    await speakStreaming(answer);

    if (liveActive) runLiveTurn();
  }

  liveTrigger.addEventListener('click', openLiveMode);
  liveClose.addEventListener('click', closeLiveMode);
  liveEndBtn.addEventListener('click', closeLiveMode);

  // =========================
  // Multi-chat sidebar + per-chat memory
  // =========================

  const STORAGE_KEY = 'cupii_chats_v1';
  const ACTIVE_KEY = 'cupii_active_chat_v1';
  const HISTORY_TURNS = 8; // how many recent messages (user+assistant) to feed back as context

  const sidebar = document.getElementById('sidebar');
  const sidebarBackdrop = document.getElementById('sidebar-backdrop');
  const sidebarToggle = document.getElementById('sidebar-toggle');
  const sidebarClose = document.getElementById('sidebar-close');
  const newChatBtn = document.getElementById('new-chat-btn');
  const chatListEl = document.getElementById('chat-list');

  let chats = {};
  let activeChatId = null;

  function loadChats(){
    try{
      chats = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    } catch(e){
      chats = {};
    }
    activeChatId = localStorage.getItem(ACTIVE_KEY);
  }

  function saveChats(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
    if (activeChatId) localStorage.setItem(ACTIVE_KEY, activeChatId);
  }

  function makeChatId(){
    return 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  }

  function createChat(){
    const id = makeChatId();
    chats[id] = { id, title: 'محادثة جديدة', messages: [], updatedAt: Date.now() };
    activeChatId = id;
    saveChats();
    return id;
  }

  function currentChat(){
    return chats[activeChatId];
  }

  function truncateTitle(text){
    text = (text || '').trim();
    return text.length > 34 ? text.slice(0, 34) + '…' : text;
  }

  function recordMessage(role, content){
    const chat = currentChat();
    if (!chat) return;
    chat.messages.push({ role, content, ts: Date.now() });
    if (chat.title === 'محادثة جديدة' && role === 'user' && content){
      chat.title = truncateTitle(content);
    }
    chat.updatedAt = Date.now();
    saveChats();
    renderChatList();
  }

  // Builds a short recap of the chat's recent turns so the backend
  // (which is otherwise stateless per request) can "remember" what
  // was discussed earlier in this specific chat.
  function buildHistoryContext(){
    const chat = currentChat();
    if (!chat || chat.messages.length === 0) return '';
    const recent = chat.messages.slice(-HISTORY_TURNS);
    if (recent.length === 0) return '';
    const lines = recent.map(m => (m.role === 'user' ? 'المستخدم: ' : 'المساعد: ') + m.content);
    return 'سياق المحادثة السابق (للفهم فقط، جاوب على السؤال الحالي بالأسفل):\n' + lines.join('\n') + '\n\n';
  }

  function renderChatList(){
    chatListEl.innerHTML = '';
    const ordered = Object.values(chats).sort((a, b) => b.updatedAt - a.updatedAt);
    ordered.forEach(chat => {
      const item = document.createElement('div');
      item.className = 'chat-item' + (chat.id === activeChatId ? ' active' : '');

      const titleSpan = document.createElement('span');
      titleSpan.className = 'chat-item-title';
      titleSpan.textContent = chat.title || 'محادثة جديدة';

      const delBtn = document.createElement('button');
      delBtn.className = 'chat-item-del';
      delBtn.type = 'button';
      delBtn.setAttribute('aria-label', 'حذف المحادثة');
      delBtn.textContent = '×';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteChat(chat.id);
      });

      item.appendChild(titleSpan);
      item.appendChild(delBtn);
      item.addEventListener('click', () => switchChat(chat.id));
      chatListEl.appendChild(item);
    });
  }

  function renderThreadFromChat(){
    thread.innerHTML = '';
    const chat = currentChat();
    if (!chat || chat.messages.length === 0){
      thread.appendChild(emptyState);
      emptyState.style.display = '';
      return;
    }
    chat.messages.forEach(m => addMessage(m.role, m.content));
  }

  function switchChat(id){
    if (!chats[id]) return;
    activeChatId = id;
    saveChats();
    clearPendingImage();
    renderThreadFromChat();
    renderChatList();
    closeSidebarOnMobile();
  }

  function deleteChat(id){
    if (!confirm('تأكيد حذف المحادثة دي؟')) return;
    delete chats[id];
    if (activeChatId === id){
      const remaining = Object.keys(chats);
      activeChatId = remaining.length ? remaining[0] : createChat();
    }
    saveChats();
    renderThreadFromChat();
    renderChatList();
  }

  function newChat(){
    createChat();
    renderThreadFromChat();
    renderChatList();
    closeSidebarOnMobile();
    input.focus();
  }

  function openSidebar(){
    sidebar.classList.add('open');
    sidebarBackdrop.classList.add('visible');
  }
  function closeSidebar(){
    sidebar.classList.remove('open');
    sidebarBackdrop.classList.remove('visible');
  }
  function closeSidebarOnMobile(){
    if (window.innerWidth <= 820) closeSidebar();
  }

  sidebarToggle.addEventListener('click', () => {
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
  });
  sidebarClose.addEventListener('click', closeSidebar);
  sidebarBackdrop.addEventListener('click', closeSidebar);
  newChatBtn.addEventListener('click', newChat);

  // init
  loadChats();
  if (!activeChatId || !chats[activeChatId]){
    createChat();
  }
  renderThreadFromChat();
  renderChatList();
</script>

</body>
</html>
